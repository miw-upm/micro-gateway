spring:
  application:
    name: micro-gateway
  profiles:
  # Profile -------------------------------------------------
    active: dev
  # ---------------------------------------------------------
  output:
    ansi:
      enabled: ALWAYS
  cache:
    type: none
  jackson:
    default-property-inclusion: NON_NULL
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://micro-user-api
          predicates:
            - Path=/users/**
        - id: order-service
          uri: lb://micro-order-api
          predicates:
            - Path=/orders/**

info:
  app:
    artifact: "@project.artifactId@"
    version: "@project.version@"
    build: "@maven.build.timestamp@"

logging:
  level:
    root: WARN
    es.upm.miw: DEBUG
    org.springframework.cloud.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway, metrics, loggers
  info:
    env:
      enabled: true
  endpoint:
    gateway:
      enabled: true
  loggers:
    enabled: true

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true