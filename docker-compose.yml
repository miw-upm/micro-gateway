services:
  api-gateway-server:
    build: .
    image: api-gateway:1.3.0
    container_name: api-gateway-server
    restart: always
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - miw

networks:
  miw:
    external: true

#> docker compose up --build -d